services:
  # Render Frontend (Static Site)
  - type: web
    name: audiolink-media-converter
    env: static
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://audiolink-media-api.onrender.com
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyBFF9m_6NidWN0HxpDG9TRjOLiytOgNbn4
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: url-shortener-61f15.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: url-shortener-61f15
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: url-shortener-61f15.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "641845296081"
      - key: VITE_FIREBASE_APP_ID
        value: 1:641845296081:web:b8ac03bc766b5a10763ef0
      - key: VITE_FIREBASE_DATABASE_URL
        value: https://url-shortener-61f15-default-rtdb.asia-southeast1.firebasedatabase.app

  # Render Media API (Node Web Service)
  - type: web
    name: audiolink-media-api
    env: node
    plan: free
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm run api:start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://audiolink-media-converter.onrender.com
      - key: APP_URL
        value: https://audiolink-media-api.onrender.com
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: url-shortener-61f15.firebasestorage.app
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyBFF9m_6NidWN0HxpDG9TRjOLiytOgNbn4